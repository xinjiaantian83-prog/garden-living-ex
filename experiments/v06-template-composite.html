<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden Living 固定テンプレ合成 試作</title>
  <link rel="stylesheet" href="./v06-template-composite.css">
</head>
<body>
  <main class="prototype-shell">
    <section class="hero">
      <p class="eyebrow">Garden Living / Composite Prototype</p>
      <h1>選ぶだけで、庭の完成イメージを切り替える。</h1>
      <p>自由編集ではなく、事前に自然な配置を調整した「なし / パターンA / パターンB」を切り替える検証です。APIは呼ばず、ブラウザ内のCanvas合成だけで動作します。</p>
    </section>

    <section class="preview-card" aria-label="完成イメージプレビュー">
      <canvas id="composite-canvas" width="1168" height="768"></canvas>
      <div class="preview-meta">
        <strong id="preset-name">カスタム選択</strong>
        <span id="render-time">render: - ms</span>
      </div>
    </section>

    <section class="controls" aria-label="商品パターン選択">
      <div class="preset-row">
        <button type="button" class="preset-button is-active" data-preset="backyard-basic">おすすめ 1</button>
        <button type="button" class="preset-button" data-preset="dogrun">おすすめ 2</button>
        <button type="button" class="preset-button" data-preset="pizza-party">おすすめ 3</button>
        <button type="button" class="preset-button" data-preset="clean-lawn">おすすめ 4</button>
      </div>

      <div id="product-controls" class="product-controls"></div>
    </section>

    <section class="summary">
      <h2>選択中の構成</h2>
      <ul id="selection-summary"></ul>
      <p class="note">この試作は合成方式のUX確認用です。商品切り抜きPNGではなく、固定構図に合わせた簡易レイヤーで速度・操作数・見え方を確認しています。</p>
    </section>
  </main>
  <script src="./v06-template-composite.js"></script>
</body>
</html>
